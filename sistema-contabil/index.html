<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema Contábil de Estudo</title>
  <meta name="description" content="Sistema de contabilidade online para estudo: plano de contas, lançamentos em partidas dobradas, diário, razão, balancete, DRE e balanço.">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <strong>Contábil</strong><span>estudo</span>
    </div>
    <div class="topo-controles" id="topo-controles"></div>
  </header>
  <nav class="menu" id="menu" aria-label="Módulos"></nav>
  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
  <main id="conteudo" class="conteudo">
    <p class="carregando">Carregando…</p>
  </main>
  <footer class="rodape">
    Projeto de estudo. Dados públicos em <code>dados-publicos/</code> (GitHub) · dados privados no Firebase ou neste navegador.
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
